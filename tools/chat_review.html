<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Review</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Segoe UI, Arial, sans-serif;
      color: #202124;
      background: #f3f5f8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); min-height: 100vh; }
    aside { display: flex; flex-direction: column; border-right: 1px solid #d9dee7; background: #fff; min-height: 100vh; }
    .sidebar-top { padding: 18px; border-bottom: 1px solid #e3e7ed; }
    h1 { margin: 0 0 16px; font-size: 20px; }
    label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
    select, input[type="number"] { height: 38px; border: 1px solid #c7ced9; border-radius: 6px; padding: 0 9px; background: white; }
    select { width: 100%; }
    .add-row { display: grid; grid-template-columns: 78px 1fr; gap: 8px; margin-top: 12px; }
    .primary { color: #fff; background: #185abc; border: 1px solid #185abc; border-radius: 6px; padding: 8px 12px; }
    .primary:hover { background: #124a9c; }
    .primary:disabled, button:disabled { opacity: .55; cursor: not-allowed; }
    #notice { min-height: 20px; padding: 8px 18px 0; color: #526174; font-size: 13px; }
    #notice.error { color: #b3261e; }
    .chat-list { flex: 1; overflow-y: auto; padding: 8px; }
    .chat-row { display: block; width: 100%; text-align: left; padding: 11px 12px; margin-bottom: 5px; background: #fff; border: 1px solid transparent; border-radius: 7px; }
    .chat-row:hover { background: #f5f7fb; }
    .chat-row.selected { border-color: #9dbcf2; background: #edf3ff; }
    .chat-row-title { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
    .chat-row-meta { display: block; margin-top: 5px; color: #586575; font-size: 12px; }
    .status-symbol { white-space: nowrap; }
    .edited-badge { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 999px; background: #fef3c7; color: #92400e; border: 1px solid #f59e0b66; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .source-badge { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .source-badge.ai { background: #ede9fe; color: #5b21b6; border: 1px solid #a78bfa80; }
    .source-badge.ai_human { background: #dcfce7; color: #166534; border: 1px solid #4ade8080; }
    .source-badge.human { background: #e2e8f0; color: #334155; border: 1px solid #94a3b880; }
    .verify-ai { color: #166534; border-color: #86efac; background: #f0fdf4; }
    .verify-ai:hover { background: #dcfce7; }
    main { min-width: 0; display: flex; flex-direction: column; max-height: 100vh; }
    .chat-header { padding: 18px 24px; background: #fff; border-bottom: 1px solid #d9dee7; }
    .chat-header h2 { margin: 0 0 7px; font-size: 20px; }
    #current-status { color: #596579; font-size: 14px; }
    #review-reason { margin-top: 5px; color: #7a2d2d; font-size: 13px; overflow-wrap: anywhere; }
    #review-reason.edit-reason { color: #92400e; }
    .context-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .context-button { border: 1px solid #b7c1ce; border-radius: 6px; background: #fff; padding: 7px 11px; }
    .context-button:hover { background: #f5f7fa; }
    .context-button.danger { color: #8c1d18; border-color: #d9a7a4; }
    .conversation { flex: 1; overflow-y: auto; padding: 24px; }
    .empty-state { color: #647184; margin: auto; text-align: center; padding: 36px; }
    .message { max-width: 900px; margin: 0 auto 12px; padding: 12px 14px; border-radius: 9px; background: #fff; box-shadow: 0 1px 2px #172b4d12; }
    .message.customer { background: #e8f0fe; }
    .message.agent { background: #fff; }
    .message.action { background: #f0f1f3; color: #454b54; }
    .message-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
    .speaker { color: #536174; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .message-actions { display: flex; gap: 6px; opacity: .75; }
    .message:hover .message-actions, .message:focus-within .message-actions { opacity: 1; }
    .inline-editor { margin-top: 6px; display: flex; flex-direction: column; gap: 8px; }
    .inline-editor-row { display: flex; align-items: center; gap: 8px; }
    .inline-editor select { width: auto; height: 32px; font-size: 13px; }
    .inline-editor textarea { width: 100%; min-height: 70px; padding: 8px; border: 1px solid #c7ced9; border-radius: 6px; resize: vertical; line-height: 1.45; }
    .inline-editor-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .message-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
    .action-details { margin-top: 9px; padding-top: 8px; border-top: 1px solid #d5d9df; font-size: 13px; }
    .action-function { font-weight: 700; overflow-wrap: anywhere; }
    .action-parameters { margin: 4px 0 0; padding-left: 20px; overflow-wrap: anywhere; }
    .action-expected { margin-top: 7px; color: #37445a; }
    .action-expected-list { margin: 4px 0 0; padding-left: 20px; overflow-wrap: anywhere; }
    .actions { display: flex; justify-content: center; gap: 12px; padding: 16px; background: #fff; border-top: 1px solid #d9dee7; }
    .decision { border: 1px solid #aeb8c6; border-radius: 6px; background: white; padding: 9px 16px; }
    .decision:hover { background: #f5f7fa; }
    .rollback { margin-left: 12px; color: #5b2630; border-color: #d3aab0; }
    .modal-backdrop { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: #10182880; }
    .modal-backdrop[hidden] { display: none; }
    .modal { width: min(420px, 100%); padding: 22px; background: white; border-radius: 10px; box-shadow: 0 12px 40px #0003; }
    .modal h2 { margin: 0 0 10px; font-size: 18px; }
    .modal p { color: #4c5665; line-height: 1.45; }
    .modal textarea { width: 100%; min-height: 82px; margin-top: 6px; padding: 8px; border: 1px solid #c7ced9; border-radius: 6px; resize: vertical; }
    .reason-hint { margin: 4px 0 0; color: #647184; font-size: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
    .secondary { border: 1px solid #c4cbd5; border-radius: 6px; padding: 8px 13px; background: white; }
    .info-modal-backdrop { position: fixed; inset: 0; z-index: 4; display: grid; place-items: center; padding: 20px; background: #10182880; }
    .info-modal-backdrop[hidden] { display: none; }
    .info-modal { display: flex; flex-direction: column; width: min(900px, 100%); max-height: 88vh; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 12px 40px #0003; }
    .info-modal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid #e1e5eb; }
    .info-modal-header h2 { margin: 0; font-size: 19px; }
    .info-content { overflow: auto; padding: 8px 4px; }
    .info-content h3 { margin: 16px 0 8px; font-size: 16px; }
    .sop-group { margin: 10px 0; }
    .sop-key { display: block; margin-bottom: 4px; color: #37445a; font-size: 13px; font-weight: 700; }
    .sop-value { line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .sop-list { padding-left: 22px; }
    .scenario-json { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
    .edit-modal { display: flex; flex-direction: column; width: min(960px, 100%); max-height: 90vh; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 12px 40px #0003; }
    .edit-paste-box { margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #e1e5eb; }
    .edit-paste-box textarea { width: 100%; min-height: 76px; padding: 8px; border: 1px solid #c7ced9; border-radius: 6px; font-family: Consolas, monospace; font-size: 12px; resize: vertical; }
    .edit-paste-actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .edit-turns { flex: 1; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 10px; }
    .edit-turn-card { border: 1px solid #d5dbe4; border-radius: 8px; padding: 10px 12px; background: #fff; }
    .edit-turn-card.customer { background: #f4f8ff; border-color: #c7dafc; }
    .edit-turn-card.action { background: #f5f6f8; border-color: #d5d9df; }
    .edit-turn-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .edit-turn-top-left { display: flex; align-items: center; gap: 8px; }
    .edit-turn-top select { width: auto; height: 30px; font-size: 13px; }
    .edit-turn-top-actions { display: flex; gap: 6px; }
    .small-btn { border: 1px solid #c4cbd5; border-radius: 5px; background: #fff; padding: 4px 8px; font-size: 12px; }
    .small-btn:hover { background: #f5f7fa; }
    .small-btn.danger { color: #8c1d18; border-color: #d9a7a4; }
    .edit-turn-card textarea { width: 100%; min-height: 54px; padding: 7px 9px; border: 1px solid #c7ced9; border-radius: 6px; resize: vertical; line-height: 1.4; }
    .edit-action-fields { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; margin-top: 4px; }
    .edit-action-fields[hidden] { display: none; }
    .edit-action-fields input { width: 100%; height: 32px; padding: 0 8px; border: 1px solid #c7ced9; border-radius: 6px; font-size: 13px; }
    .edit-action-hint { grid-column: 1 / -1; color: #4c5665; font-size: 12px; }
    .edit-error { color: #b3261e; font-size: 13px; margin-top: 6px; }
    .edit-modal-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 12px; border-top: 1px solid #e1e5eb; margin-top: 12px; }
    .edit-modal-footer-right { display: flex; gap: 8px; }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      aside { min-height: 0; max-height: 42vh; border-right: 0; border-bottom: 1px solid #d9dee7; }
      .chat-list { max-height: 22vh; }
      main { min-height: 58vh; max-height: none; }
      .conversation { padding: 14px; }
      .chat-header { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <div class="sidebar-top">
        <h1>Chat Review</h1>
        <label for="reviewer-select">Reviewer</label>
        <select id="reviewer-select"></select>
        <div class="add-row">
          <input id="add-count" type="number" min="1" value="5" aria-label="Number of chats to add">
          <button id="add-chats" class="primary" type="button">Add Chats</button>
        </div>
      </div>
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="chat-list" class="chat-list" aria-label="Assigned chats"></div>
    </aside>
    <main>
      <header class="chat-header">
        <h2 id="chat-title">Select a chat</h2>
        <div id="current-status">Choose a chat from the list to review it.</div>
        <div id="review-reason" hidden></div>
        <div class="context-buttons">
          <button id="view-sop" class="context-button" type="button" disabled>View SOP</button>
          <button id="view-scenario" class="context-button" type="button" disabled>View User Scenario</button>
          <button id="copy-prompt" class="context-button" type="button" disabled>Copy Prompt</button>
          <button id="copy-old-prompt" class="context-button" type="button" hidden>Copy Old Prompt</button>
          <button id="edit-chat" class="context-button" type="button" disabled>Replace from Model</button>
          <button id="revert-chat" class="context-button danger" type="button" hidden>Revert to Original</button>
          <button id="remove-chat" class="context-button danger" type="button" disabled>Remove Chat</button>
        </div>
      </header>
      <section id="conversation" class="conversation" aria-live="polite">
        <div class="empty-state">Select a chat from the list.</div>
      </section>
      <footer class="actions">
        <button id="mark-error" class="decision" type="button" disabled>Has Error ❌</button>
        <button id="mark-no-error" class="decision" type="button" disabled>No Error ✅</button>
        <button id="verify-ai" class="decision verify-ai" type="button" hidden>Confirm AI Review (AI + Human ✓)</button>
        <button id="rollback" class="decision rollback" type="button" hidden>Rollback to Pending</button>
      </footer>
    </main>
  </div>
  <div id="confirm-modal" class="modal-backdrop" role="presentation" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Confirm review</h2>
      <p id="modal-message"></p>
      <div id="reason-field" hidden>
        <label for="error-reason">Briefly explain the error</label>
        <textarea id="error-reason" maxlength="300" aria-required="true" aria-describedby="reason-hint"></textarea>
        <div id="reason-hint" class="reason-hint">Required, up to 300 characters.</div>
      </div>
      <div id="modal-error" class="edit-error" hidden></div>
      <div class="modal-actions">
        <button id="cancel-action" class="secondary" type="button">Cancel</button>
        <button id="confirm-action" class="primary" type="button">Confirm</button>
      </div>
    </section>
  </div>
  <div id="info-modal" class="info-modal-backdrop" role="presentation" hidden>
    <section class="info-modal" role="dialog" aria-modal="true" aria-labelledby="info-title">
      <header class="info-modal-header">
        <h2 id="info-title"></h2>
        <button id="close-info" class="secondary" type="button">Close</button>
      </header>
      <div id="info-content" class="info-content"></div>
    </section>
  </div>
  <div id="edit-modal" class="info-modal-backdrop" role="presentation" hidden>
    <section class="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-title">
      <header class="info-modal-header">
        <h2 id="edit-title">Replace Chat from Model Response</h2>
        <button id="close-edit" class="secondary" type="button">Close</button>
      </header>
      <div class="edit-paste-box">
        <label for="paste-chat-json">Paste model response or JSON array</label>
        <textarea id="paste-chat-json" placeholder="Paste the full model reply (with ```json ... ```) or a raw JSON array of messages..."></textarea>
        <div class="edit-paste-actions">
          <button id="parse-paste-btn" class="secondary" type="button">Preview Parsed Chat</button>
        </div>
        <div id="edit-error" class="edit-error" hidden></div>
      </div>
      <div id="edit-preview" class="edit-turns">
        <div class="empty-state">Paste a model response above and click "Preview Parsed Chat".</div>
      </div>
      <footer class="edit-modal-footer">
        <div>
          <button id="modal-revert-chat" class="context-button danger" type="button" hidden>Revert to Original</button>
        </div>
        <div class="edit-modal-footer-right">
          <button id="cancel-edit" class="secondary" type="button">Cancel</button>
          <button id="save-edit" class="primary" type="button" disabled>Replace Chat</button>
        </div>
      </footer>
    </section>
  </div>
  <script>
    const REVIEWERS = __REVIEWERS_JSON__;
    const state = {
      reviewer: "",
      chats: [],
      selectedId: null,
      pendingAction: null,
      parsedMessages: null,
      inlineEdit: null
    };
    const reviewerSelect = document.getElementById("reviewer-select");
    const chatList = document.getElementById("chat-list");
    const notice = document.getElementById("notice");
    const modal = document.getElementById("confirm-modal");
    const infoModal = document.getElementById("info-modal");
    const editModal = document.getElementById("edit-modal");

    function statusLabel(status) {
      if (status === "error") return "❌ Error";
      if (status === "no_error") return "✅ No Error";
      return "⏳ Pending";
    }

    function formatReviewDate(isoString) {
      if (!isoString) return "";
      const date = new Date(isoString);
      if (Number.isNaN(date.getTime())) return isoString;
      return date.toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
    }

    function createReviewSourceBadge(reviewedBy) {
      if (!reviewedBy) return null;
      const badge = document.createElement("span");
      badge.className = `source-badge ${reviewedBy}`;
      if (reviewedBy === "ai") badge.textContent = "🤖 AI";
      else if (reviewedBy === "ai_human") badge.textContent = "🤖+👤 AI + Human";
      else if (reviewedBy === "human") badge.textContent = "👤 Human";
      else badge.textContent = reviewedBy;
      return badge;
    }

    function showNotice(message, isError = false) {
      notice.textContent = message;
      notice.classList.toggle("error", isError);
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `Request failed (${response.status})`);
      return payload;
    }

    function currentChat() {
      return state.chats.find(chat => chat.chat_id === state.selectedId) || null;
    }

    function renderList() {
      chatList.replaceChildren();
      for (const chat of state.chats) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "chat-row" + (chat.chat_id === state.selectedId ? " selected" : "");
        const title = document.createElement("span");
        title.className = "chat-row-title";
        const sop = document.createElement("span");
        sop.textContent = chat.sop_name;
        const status = document.createElement("span");
        status.className = "status-symbol";
        status.textContent = statusLabel(chat.status);
        const sourceBadge = createReviewSourceBadge(chat.reviewed_by);
        if (sourceBadge) status.append(sourceBadge);
        if (chat.edited || chat.has_original) {
          const editedBadge = document.createElement("span");
          editedBadge.className = "edited-badge";
          editedBadge.textContent = "✏️ Edited";
          status.append(editedBadge);
        }
        title.append(sop, status);
        const meta = document.createElement("span");
        meta.className = "chat-row-meta";
        let dateText = "";
        if (chat.reviewed_at) {
          dateText = ` · Reviewed ${formatReviewDate(chat.reviewed_at)}`;
        } else if ((chat.edited || chat.has_original) && chat.edited_at) {
          dateText = ` · Edited ${formatReviewDate(chat.edited_at)}`;
        }
        meta.textContent = `${chat.message_count} messages · ID ${chat.chat_id}${dateText}`;
        row.append(title, meta);
        row.addEventListener("click", () => {
          state.selectedId = chat.chat_id;
          state.inlineEdit = null;
          renderList();
          renderSelected();
        });
        chatList.append(row);
      }
    }

    function buildInlineEditorCard(draft, titleText, onSave, onCancel) {
      const editor = document.createElement("div");
      editor.className = "inline-editor";

      const topRow = document.createElement("div");
      topRow.className = "inline-editor-row";
      const label = document.createElement("strong");
      label.textContent = titleText;
      const speakerSelect = document.createElement("select");
      for (const role of ["customer", "agent", "action"]) {
        const opt = document.createElement("option");
        opt.value = role;
        opt.textContent = role;
        opt.selected = draft.speaker === role;
        speakerSelect.append(opt);
      }
      topRow.append(label, speakerSelect);

      const textarea = document.createElement("textarea");
      textarea.value = draft.text;
      textarea.placeholder = "Enter message text...";
      textarea.addEventListener("input", () => {
        draft.text = textarea.value;
      });

      const sopActions = currentChat()?.sop_actions || {};
      const actionNames = Object.keys(sopActions);
      const findMatchingAction = rawName => {
        const norm = String(rawName || "").toLowerCase().replace(/[^a-z0-9]/g, "");
        if (!norm) return null;
        return actionNames.find(
          name => name.toLowerCase().replace(/[^a-z0-9]/g, "") === norm
        ) || null;
      };

      const actionFields = document.createElement("div");
      actionFields.className = "edit-action-fields";
      actionFields.hidden = draft.speaker !== "action";

      const listId = `sop-actions-list-${Math.random().toString(36).slice(2, 8)}`;
      const datalist = document.createElement("datalist");
      datalist.id = listId;
      for (const name of actionNames) {
        const option = document.createElement("option");
        option.value = name;
        datalist.append(option);
      }

      const fnInput = document.createElement("input");
      fnInput.type = "text";
      fnInput.setAttribute("list", listId);
      fnInput.placeholder = actionNames.length
        ? "Type or choose function..."
        : "function_name";
      fnInput.value = draft.function_name || "";

      const paramsInput = document.createElement("input");
      paramsInput.type = "text";
      paramsInput.placeholder = "parameters (auto-filled from SOP)";
      paramsInput.value = (draft.parameters || []).join(", ");

      const actionHint = document.createElement("div");
      actionHint.className = "edit-action-hint";
      const updateActionHint = matched => {
        if (!matched) {
          actionHint.textContent = actionNames.length
            ? `Available in SOP: ${actionNames.join(", ")}`
            : "";
          return;
        }
        const expected = sopActions[matched] || [];
        actionHint.textContent = expected.length
          ? `SOP parameters for ${matched}: ${expected.join(", ")}`
          : `SOP parameters for ${matched}: (none)`;
      };
      updateActionHint(findMatchingAction(draft.function_name));

      fnInput.addEventListener("input", () => {
        draft.function_name = fnInput.value;
        const matched = findMatchingAction(fnInput.value);
        if (matched) {
          draft.function_name = matched;
          draft.parameters = [...(sopActions[matched] || [])];
          paramsInput.value = draft.parameters.join(", ");
        }
        updateActionHint(matched);
      });
      paramsInput.addEventListener("input", () => {
        draft.parameters = paramsInput.value
          .split(",")
          .map(part => part.trim())
          .filter(Boolean);
      });
      actionFields.append(datalist, fnInput, paramsInput, actionHint);

      speakerSelect.addEventListener("change", () => {
        draft.speaker = speakerSelect.value;
        actionFields.hidden = draft.speaker !== "action";
        if (draft.speaker === "action") {
          const matched = findMatchingAction(fnInput.value);
          if (matched && (!draft.parameters || draft.parameters.length === 0)) {
            draft.function_name = matched;
            draft.parameters = [...(sopActions[matched] || [])];
            paramsInput.value = draft.parameters.join(", ");
          }
          updateActionHint(matched);
        }
      });

      const actionsRow = document.createElement("div");
      actionsRow.className = "inline-editor-actions";
      const cancelBtn = document.createElement("button");
      cancelBtn.type = "button";
      cancelBtn.className = "secondary";
      cancelBtn.textContent = "Cancel";
      cancelBtn.addEventListener("click", onCancel);
      const saveBtn = document.createElement("button");
      saveBtn.type = "button";
      saveBtn.className = "primary";
      saveBtn.textContent = "Save";
      saveBtn.addEventListener("click", () => onSave(saveBtn));
      actionsRow.append(cancelBtn, saveBtn);

      editor.append(topRow, textarea, actionFields, actionsRow);
      return editor;
    }

    function renderConversationMessages(container, messages, interactive = false) {
      container.replaceChildren();
      messages.forEach((message, index) => {
        const isEditingThis =
          interactive &&
          state.inlineEdit &&
          state.inlineEdit.mode === "edit" &&
          state.inlineEdit.index === index;

        const messageNode = document.createElement("article");
        const role = String(
          isEditingThis ? state.inlineEdit.draft.speaker : (message.speaker || "")
        ).toLowerCase();
        messageNode.className = `message ${["agent", "customer", "action"].includes(role) ? role : ""}`;

        if (isEditingThis) {
          messageNode.append(
            buildInlineEditorCard(
              state.inlineEdit.draft,
              `Edit #${index + 1}`,
              saveInlineEdit,
              () => {
                state.inlineEdit = null;
                renderSelected();
              }
            )
          );
          container.append(messageNode);
          return;
        }

        const header = document.createElement("div");
        header.className = "message-header";
        const speaker = document.createElement("div");
        speaker.className = "speaker";
        speaker.textContent = message.speaker;
        header.append(speaker);

        if (interactive) {
          const actions = document.createElement("div");
          actions.className = "message-actions";

          const editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.className = "small-btn";
          editBtn.textContent = "Edit";
          editBtn.addEventListener("click", () => {
            state.inlineEdit = {
              mode: "edit",
              index,
              draft: {
                speaker: String(message.speaker || "agent").toLowerCase(),
                text: String(message.text || ""),
                function_name: String(message.function_name || ""),
                parameters: Array.isArray(message.parameters) ? message.parameters.map(String) : []
              }
            };
            renderSelected();
          });

          const addBelowBtn = document.createElement("button");
          addBelowBtn.type = "button";
          addBelowBtn.className = "small-btn";
          addBelowBtn.textContent = "+ Add Below";
          addBelowBtn.addEventListener("click", () => {
            state.inlineEdit = {
              mode: "add",
              index,
              draft: {
                speaker: "agent",
                text: "",
                function_name: "",
                parameters: []
              }
            };
            renderSelected();
          });

          const deleteBtn = document.createElement("button");
          deleteBtn.type = "button";
          deleteBtn.className = "small-btn danger";
          deleteBtn.textContent = "Delete";
          deleteBtn.disabled = messages.length <= 1;
          deleteBtn.addEventListener("click", () => deleteMessageAt(index));

          actions.append(editBtn, addBelowBtn, deleteBtn);
          header.append(actions);
        }

        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = message.text;
        messageNode.append(header, text);
        if (role === "action") {
          const details = document.createElement("div");
          details.className = "action-details";
          const functionName = document.createElement("div");
          functionName.className = "action-function";
          functionName.textContent = `Function: ${message.function_name || "unknown"}`;
          details.append(functionName);

          const parameterLabel = document.createElement("div");
          parameterLabel.textContent = "Parameters:";
          details.append(parameterLabel);
          const parameters = document.createElement("ul");
          parameters.className = "action-parameters";
          const values = Array.isArray(message.parameters) ? message.parameters : [];
          if (values.length === 0) {
            const emptyParameter = document.createElement("li");
            emptyParameter.textContent = "(none)";
            parameters.append(emptyParameter);
          } else {
            for (const value of values) {
              const parameter = document.createElement("li");
              parameter.textContent = typeof value === "string" ? value : JSON.stringify(value);
              parameters.append(parameter);
            }
          }
          details.append(parameters);

          if ("expected_parameters" in message) {
            const expectedLabel = document.createElement("div");
            expectedLabel.className = "action-expected";
            expectedLabel.textContent = "Expected parameters:";
            details.append(expectedLabel);
            const expectedParameters = document.createElement("ul");
            expectedParameters.className = "action-expected-list";
            if (!Array.isArray(message.expected_parameters)) {
              const missingSchema = document.createElement("li");
              missingSchema.textContent = "Not listed for this subflow";
              expectedParameters.append(missingSchema);
            } else if (message.expected_parameters.length === 0) {
              const emptyExpected = document.createElement("li");
              emptyExpected.textContent = "(none)";
              expectedParameters.append(emptyExpected);
            } else {
              for (const parameterName of message.expected_parameters) {
                const expectedParameter = document.createElement("li");
                expectedParameter.textContent = parameterName;
                expectedParameters.append(expectedParameter);
              }
            }
            details.append(expectedParameters);
          }
          messageNode.append(details);
        }
        container.append(messageNode);

        if (
          interactive &&
          state.inlineEdit &&
          state.inlineEdit.mode === "add" &&
          state.inlineEdit.index === index
        ) {
          const addNode = document.createElement("article");
          addNode.className = "message";
          addNode.append(
            buildInlineEditorCard(
              state.inlineEdit.draft,
              `New turn after #${index + 1}`,
              saveInlineEdit,
              () => {
                state.inlineEdit = null;
                renderSelected();
              }
            )
          );
          container.append(addNode);
        }
      });
    }

    function renderSelected() {
      const chat = currentChat();
      const conversation = document.getElementById("conversation");
      conversation.replaceChildren();
      const errorButton = document.getElementById("mark-error");
      const noErrorButton = document.getElementById("mark-no-error");
      const verifyAiButton = document.getElementById("verify-ai");
      const rollbackButton = document.getElementById("rollback");
      const viewSopButton = document.getElementById("view-sop");
      const viewScenarioButton = document.getElementById("view-scenario");
      const copyPromptButton = document.getElementById("copy-prompt");
      const copyOldPromptButton = document.getElementById("copy-old-prompt");
      const editChatButton = document.getElementById("edit-chat");
      const revertChatButton = document.getElementById("revert-chat");
      const removeChatButton = document.getElementById("remove-chat");
      const reviewReason = document.getElementById("review-reason");
      if (!chat) {
        document.getElementById("chat-title").textContent = "Select a chat";
        document.getElementById("current-status").textContent = "Choose a chat from the list to review it.";
        reviewReason.hidden = true;
        reviewReason.textContent = "";
        conversation.innerHTML = '<div class="empty-state">Select a chat from the list.</div>';
        errorButton.disabled = true;
        noErrorButton.disabled = true;
        verifyAiButton.hidden = true;
        rollbackButton.hidden = true;
        viewSopButton.disabled = true;
        viewScenarioButton.disabled = true;
        copyPromptButton.disabled = true;
        copyPromptButton.textContent = "Copy Prompt";
        copyOldPromptButton.hidden = true;
        copyOldPromptButton.disabled = true;
        editChatButton.disabled = true;
        revertChatButton.hidden = true;
        removeChatButton.disabled = true;
        return;
      }

      document.getElementById("chat-title").textContent = `${chat.sop_name} · ${chat.chat_id}`;

      currentStatus.textContent = `Current status: ${statusLabel(chat.status)}`;
      const sourceBadge = createReviewSourceBadge(chat.reviewed_by);
      if (sourceBadge) currentStatus.append(sourceBadge);
      if (chat.edited || chat.has_original) {
        const editedBadge = document.createElement("span");
        editedBadge.className = "edited-badge";
        editedBadge.textContent = "✏️ Edited";
        currentStatus.append(editedBadge);
      }

        currentStatus.append(` · Reviewed ${formatReviewDate(chat.reviewed_at)}`);
      }

        ? `${chat.status === "error" ? "Reason" : "Edit reason"}: ${chat.review_reason}`
        : "";

      noErrorButton.disabled = false;
      verifyAiButton.hidden = chat.reviewed_by !== "ai" || chat.status === "pending";
      viewSopButton.disabled = false;
      viewScenarioButton.disabled = false;
      const hasOldChat = Boolean(chat.has_original && Array.isArray(chat.original_messages));
      copyPromptButton.disabled = false;
      copyPromptButton.textContent = hasOldChat ? "Copy New Prompt" : "Copy Prompt";
      copyOldPromptButton.hidden = !hasOldChat;
      copyOldPromptButton.disabled = !hasOldChat;
      editChatButton.disabled = false;
      revertChatButton.hidden = !chat.has_original;
      removeChatButton.disabled = false;
      rollbackButton.hidden = chat.status === "pending";

    function appendSopValue(parent, value) {
        if (Array.isArray(value)) {
          const list = document.createElement("ul");
          list.className = "sop-list";
          for (const item of value) {
            const listItem = document.createElement("li");
            appendSopValue(listItem, item);
            list.append(listItem);
          }
          parent.append(list);
          return;
        }
        if (value && typeof value === "object") {
          for (const [key, nestedValue] of Object.entries(value)) {
            const group = document.createElement("div");
            group.className = "sop-group";
            const label = document.createElement("span");
            label.className = "sop-key";
            label.textContent = key.replaceAll("_", " ");
            group.append(label);
            appendSopValue(group, nestedValue);
            parent.append(group);
          }
          return;
        }
        const text = document.createElement("div");
        text.className = "sop-value";
        text.textContent = value == null ? "" : String(value);
        parent.append(text);
    }

    function openInfo(kind) {
        const chat = currentChat();
        if (!chat) return;
        const content = document.getElementById("info-content");
        const title = document.getElementById("info-title");
        content.replaceChildren();
        if (kind === "scenario") {
          title.textContent = `User Scenario · ${chat.sop_name}`;
          const scenario = document.createElement("pre");
          scenario.className = "scenario-json";
          scenario.textContent = JSON.stringify(chat.scenario, null, 2);
          content.append(scenario);
        } else {
          title.textContent = `SOP · ${chat.sop_name}`;
          for (const [key, value] of Object.entries(chat.sop_guideline || {})) {
            const section = document.createElement("section");
            const heading = document.createElement("h3");
            heading.textContent = key.replaceAll("_", " ");
            section.append(heading);
            appendSopValue(section, value);
            content.append(section);
          }
          if (!content.childElementCount) {
            content.textContent = "No guideline content is available for this SOP.";
          }
        }
        infoModal.hidden = false;
        document.getElementById("close-info").focus();
    }

    function renderChats(chats, preferredId = state.selectedId) {
      state.chats = chats;
      state.selectedId = chats.some(chat => chat.chat_id === preferredId)
        ? preferredId
        : (chats[0]?.chat_id || null);
      renderList();
      renderSelected();
    }

    async function loadReviewer() {
      state.reviewer = reviewerSelect.value;
      state.selectedId = null;
      showNotice("Loading chats…");
      try {
        const payload = await requestJson(`/api/chats/${encodeURIComponent(state.reviewer)}`);
        renderChats(payload.chats, null);
        showNotice(`${payload.chats.length} chat(s) assigned.`);
      } catch (error) {
        renderChats([], null);
        showNotice(error.message, true);
      }
    }

    function confirmAction(action) {
      const chat = currentChat();
      if (!chat) return;
      state.pendingAction = action;
      const reasonField = document.getElementById("reason-field");
      const reasonInput = document.getElementById("error-reason");
      const reasonLabel = reasonField.querySelector("label");
      const reasonHint = document.getElementById("reason-hint");
      const isEditedNoError = action === "no_error" && (chat.edited || chat.has_original);
      const showReason = action === "error" || isEditedNoError;
      reasonField.hidden = !showReason;
      reasonLabel.textContent = action === "error"
        ? "Briefly explain the error"
        : "Why was this chat edited? (optional)";
      reasonHint.textContent = action === "error"
        ? "Required, up to 300 characters."
        : "Optional, up to 300 characters.";
      reasonInput.value = showReason ? (chat.review_reason || "") : "";
      let message;
      if (action === "rollback") {
        message = "Are you sure you want to return this chat to Pending?";
      } else if (action === "remove") {
        message = `Are you sure you want to remove chat ${chat.chat_id} (${chat.sop_name}) from ${state.reviewer}?`;
      } else {
        const label = action === "error" ? "Error" : "No Error";
        message = `Are you sure you want to mark this chat as ${label}?`;
      }
      document.getElementById("modal-message").textContent = message;
      const modalError = document.getElementById("modal-error");
      modalError.textContent = "";
      modalError.hidden = true;
      modal.hidden = false;
      document.getElementById(action === "error" ? "error-reason" : "confirm-action").focus();
    }

    async function applyAction() {
      const chat = currentChat();
      if (!chat || !state.pendingAction) return;
      const action = state.pendingAction;
      const modalError = document.getElementById("modal-error");
      modalError.textContent = "";
      modalError.hidden = true;
      let endpoint = "/api/review";
      if (action === "rollback") endpoint = "/api/rollback";
      else if (action === "remove") endpoint = "/api/remove-chat";
      const body = { reviewer: state.reviewer, chat_id: chat.chat_id };
      if (action !== "rollback" && action !== "remove") {
        body.status = action;
        const isEditedNoError = action === "no_error" && (chat.edited || chat.has_original);
        if (action === "error" || isEditedNoError) {
          body.reason = document.getElementById("error-reason").value.trim();
        }
        if (action === "error" && !body.reason) {
          modalError.textContent = "Enter a short reason before marking this chat as having an error.";
          modalError.hidden = false;
          document.getElementById("error-reason").focus();
          return;
        }
      }
      document.getElementById("confirm-action").disabled = true;
      try {
        const payload = await requestJson(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (action === "remove") {
          state.inlineEdit = null;
          renderChats(payload.chats, null);
          showNotice(`Removed chat ${chat.chat_id}.`);
        } else {
          renderChats(payload.chats, chat.chat_id);
          showNotice(`Saved status: ${statusLabel(payload.status)}.`);
        }
        modal.hidden = true;
        state.pendingAction = null;
      } catch (error) {
        modalError.textContent = error.message;
        modalError.hidden = false;
        showNotice(error.message, true);
      } finally {
        document.getElementById("confirm-action").disabled = false;
      }
    }

    reviewerSelect.replaceChildren();
    for (const reviewer of REVIEWERS) {
      const option = document.createElement("option");
      option.value = reviewer;
      option.textContent = reviewer;
      reviewerSelect.append(option);
    }
    reviewerSelect.addEventListener("change", loadReviewer);
    document.getElementById("add-chats").addEventListener("click", async () => {
      const count = Number(document.getElementById("add-count").value);
      if (!Number.isInteger(count) || count < 1) {
        showNotice("Enter a positive whole number of chats.", true);
        return;
      }
      const button = document.getElementById("add-chats");
      button.disabled = true;
      try {
        const payload = await requestJson("/api/add-chats", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reviewer: state.reviewer, count })
        });
        renderChats(payload.chats, payload.added_chat_ids[0] || state.selectedId);
        showNotice(payload.warning || `Added ${payload.added} chat(s).`, Boolean(payload.warning));
      } catch (error) {
        showNotice(error.message, true);
      } finally {
        button.disabled = false;
      }
    });
    function buildEvaluationPrompt(chat, messages = chat.messages) {
      const chatLines = messages.map((message, index) => {
        const header = `${index + 1}. [${message.speaker.toUpperCase()}] ${message.text}`;
        if (String(message.speaker).toLowerCase() !== "action") return header;
        const params = Array.isArray(message.parameters) && message.parameters.length
          ? message.parameters.join(", ")
          : "(none)";
        const expected = Array.isArray(message.expected_parameters)
          ? (message.expected_parameters.length ? message.expected_parameters.join(", ") : "(none)")
          : "Not listed for this subflow";
        return `${header}\n   Function: ${message.function_name || "unknown"}\n   Parameters: ${params}\n   Expected parameters: ${expected}`;
      }).join("\n\n");

      return [
        "Check this chat against the attached SOP. Treat the SOP as the ground truth—note that the Expected parameters: lines in the chat logs are just system hints showing possible parameters, not strict SOP requirements.",
        "",
        "Important evaluation rules:",
        "- Use practical, human common sense. Do NOT nitpick natural conversational flow, small talk, empathy, or minor step-ordering flexibility (e.g., chatting briefly or reassuring the customer before asking for their name/Account ID is completely fine).",
        "- Focus ONLY on meaningful SOP violations, such as: skipping required tool calls/actions, entering wrong or blank parameters, following the wrong workflow/resolution, failing to provide required information/links/codes, or breaking explicit business rules (like issuing a refund when they shouldn't).",
        "",
        "If the chat contains violations, you will also fix the chat:",
        "- Keep all valid turns before the first mistake intact.",
        "- Fix the mistaken turn(s) naturally without changing the tone, style, or dynamic of the original conversation.",
        "- If an early mistake (e.g., calling the wrong tool, entering wrong parameters, or taking the wrong workflow path) causes downstream propagation errors, act as a simulator for both the customer and the agent from that point forward—re-simulating the remaining turns naturally so everything stays consistent with the User Scenario and the SOP through resolution.",
        "",
        "Format your response exactly like this:",
        "",
        "Violations",
        '(If there are none, state "NO/No major SOP violations.")',
        "",
        "[Step Name]: [Brief note on what the agent did correctly or violated]",
        "",
        "~300-Character Summary",
        "[A concise ~300-character summary of the violations, or a confirmation that there were none.]",
        "",
        "Corrected Chat (JSON)",
        '(Omit this section if there are no major SOP violations. Otherwise, output ONLY a single ```json code block containing the full corrected conversation array. Each item must have "speaker" ("agent", "customer", or "action") and "text". For "action" items, also include "function_name" (string) and "parameters" (array of strings).)',
        "",
        "---",
        `SOP (${chat.sop_name}):`,
        JSON.stringify(chat.sop_guideline || {}, null, 2),
        "",
        "---",
        "User Scenario:",
        JSON.stringify(chat.scenario || {}, null, 2),
        "",
        "---",
        "Chat:",
        chatLines
      ].join("\n");
    }

    async function copyTextToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const helper = document.createElement("textarea");
      helper.value = text;
      helper.style.position = "fixed";
      helper.style.opacity = "0";
      document.body.append(helper);
      helper.select();
      const copied = document.execCommand("copy");
      helper.remove();
      if (!copied) throw new Error("Clipboard copy was blocked by the browser.");
    }

    function setEditError(message = "") {
      const errorNode = document.getElementById("edit-error");
      errorNode.textContent = message;
      errorNode.hidden = !message;
    }

    function cloneMessagesForEdit(messages) {
      return messages.map(msg => ({
        speaker: String(msg.speaker || "agent").toLowerCase(),
        text: String(msg.text || ""),
        function_name: String(msg.function_name || ""),
        parameters: Array.isArray(msg.parameters) ? msg.parameters.map(String) : []
      }));
    }

    function extractJsonArrayFromPaste(raw) {
      const trimmed = raw.trim();
      if (!trimmed) throw new Error("Paste JSON or a model response first.");
      const fenceMatch = trimmed.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
      const candidates = [];
      if (fenceMatch) candidates.push(fenceMatch[1].trim());
      candidates.push(trimmed);
      const firstBracket = trimmed.indexOf("[");
      const lastBracket = trimmed.lastIndexOf("]");
      if (firstBracket !== -1 && lastBracket > firstBracket) {
        candidates.push(trimmed.slice(firstBracket, lastBracket + 1));
      }

      let parsed = null;
      for (const candidate of candidates) {
        try {
          const value = JSON.parse(candidate);
          if (Array.isArray(value)) {
            parsed = value;
            break;
          }
          if (value && typeof value === "object" && Array.isArray(value.messages)) {
            parsed = value.messages;
            break;
          }
        } catch (_) {}
      }
      if (!Array.isArray(parsed) || parsed.length === 0) {
        throw new Error("Could not find a non-empty JSON array of messages in the pasted text.");
      }
      return parsed.map((item, idx) => {
        if (!item || typeof item !== "object") {
          throw new Error(`Message #${idx + 1} must be an object.`);
        }
        const speaker = String(item.speaker || "").trim().toLowerCase();
        if (!["agent", "customer", "action"].includes(speaker)) {
          throw new Error(`Message #${idx + 1} has invalid speaker "${item.speaker}".`);
        }
        const text = String(item.text ?? "");
        if (!text.trim()) {
          throw new Error(`Message #${idx + 1} has empty text.`);
        }
        return {
          speaker,
          text,
          function_name: speaker === "action" ? String(item.function_name || "") : "",
          parameters: speaker === "action" && Array.isArray(item.parameters)
            ? item.parameters.map(String)
            : []
        };
      });
    }

    function toApiMessages(messages) {
      return messages.map(msg => {
        const speaker = String(msg.speaker || "agent").toLowerCase();
        const entry = { speaker, text: String(msg.text || "") };
        if (speaker === "action") {
          entry.function_name = String(msg.function_name || "");
          entry.parameters = Array.isArray(msg.parameters) ? msg.parameters.map(String) : [];
        }
        return entry;
      });
    }

    async function persistChatMessages(messages, successMessage) {
      const chat = currentChat();
      if (!chat) return;
      const payload = await requestJson("/api/update-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          reviewer: state.reviewer,
          chat_id: chat.chat_id,
          messages: toApiMessages(messages)
        })
      });
      state.inlineEdit = null;
      renderChats(payload.chats, chat.chat_id);
      showNotice(successMessage);
    }

    async function saveInlineEdit(saveBtn) {
      const chat = currentChat();
      if (!chat || !state.inlineEdit) return;
      const { mode, index, draft } = state.inlineEdit;
      if (!draft.text.trim()) {
        showNotice("Message text cannot be empty.", true);
        return;
      }
      const nextMessages = cloneMessagesForEdit(chat.messages);
      if (mode === "edit") {
        nextMessages[index] = { ...draft };
      } else {
        nextMessages.splice(index + 1, 0, { ...draft });
      }
      saveBtn.disabled = true;
      try {
        await persistChatMessages(
          nextMessages,
          "Chat updated. Review the changes and set the status manually."
        );
      } catch (error) {
        showNotice(error.message, true);
      } finally {
        saveBtn.disabled = false;
      }
    }

    async function deleteMessageAt(index) {
      const chat = currentChat();
      if (!chat || chat.messages.length <= 1) return;
      const nextMessages = cloneMessagesForEdit(chat.messages);
      nextMessages.splice(index, 1);
      try {
        await persistChatMessages(
          nextMessages,
          "Turn deleted. Review the changes and set the status manually."
        );
      } catch (error) {
        showNotice(error.message, true);
      }
    }

    function openEditModal() {
      const chat = currentChat();
      if (!chat) return;
      state.parsedMessages = null;
      document.getElementById("edit-title").textContent = `Replace Chat · ${chat.sop_name} (${chat.chat_id})`;
      document.getElementById("paste-chat-json").value = "";
      document.getElementById("modal-revert-chat").hidden = !chat.has_original;
      document.getElementById("save-edit").disabled = true;
      setEditError("");
      document.getElementById("edit-preview").innerHTML =
        '<div class="empty-state">Paste a model response above and click "Preview Parsed Chat".</div>';
      editModal.hidden = false;
      document.getElementById("paste-chat-json").focus();
    }

    async function saveEditedChat() {
      const chat = currentChat();
      if (!chat || !state.parsedMessages) return;
      setEditError("");
      const saveBtn = document.getElementById("save-edit");
      saveBtn.disabled = true;
      try {
        await persistChatMessages(
          state.parsedMessages,
          "Chat replaced from model output. Review the changes and set the status manually."
        );
        editModal.hidden = true;
      } catch (error) {
        setEditError(error.message);
        saveBtn.disabled = false;
      }
    }

    async function revertChatToOriginal() {
      const chat = currentChat();
      if (!chat || !chat.has_original) return;
      try {
        const payload = await requestJson("/api/revert-chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reviewer: state.reviewer, chat_id: chat.chat_id })
        });
        renderChats(payload.chats, chat.chat_id);
        editModal.hidden = true;
        showNotice("Reverted chat to original.");
      } catch (error) {
        if (!editModal.hidden) setEditError(error.message);
        else showNotice(error.message, true);
      }
    }

    document.getElementById("mark-error").addEventListener("click", () => confirmAction("error"));
    document.getElementById("mark-no-error").addEventListener("click", () => confirmAction("no_error"));
    document.getElementById("verify-ai").addEventListener("click", async () => {
      const chat = currentChat();
      if (!chat || chat.reviewed_by !== "ai" || chat.status === "pending") return;
      const btn = document.getElementById("verify-ai");
      btn.disabled = true;
      try {
        const payload = await requestJson("/api/review", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            reviewer: state.reviewer,
            chat_id: chat.chat_id,
            status: chat.status,
            reason: chat.review_reason || "",
            edited: Boolean(chat.edited || chat.has_original),
            reviewed_by: "human"
          })
        });
        renderChats(payload.chats, chat.chat_id);
        showNotice("Confirmed AI review (now marked AI + Human).");
      } catch (error) {
        showNotice(error.message, true);
      } finally {
        btn.disabled = false;
      }
    });
    document.getElementById("rollback").addEventListener("click", () => confirmAction("rollback"));
    document.getElementById("view-sop").addEventListener("click", () => openInfo("sop"));
    document.getElementById("view-scenario").addEventListener("click", () => openInfo("scenario"));
    document.getElementById("copy-prompt").addEventListener("click", async () => {
      const chat = currentChat();
      if (!chat) return;
      const hasOldChat = Boolean(chat.has_original && Array.isArray(chat.original_messages));
      try {
        await copyTextToClipboard(buildEvaluationPrompt(chat, chat.messages));
        showNotice(hasOldChat ? "New prompt copied to clipboard." : "Prompt copied to clipboard.");
      } catch (error) {
        showNotice(error.message, true);
      }
    });
    document.getElementById("copy-old-prompt").addEventListener("click", async () => {
      const chat = currentChat();
      if (!chat || !Array.isArray(chat.original_messages)) return;
      try {
        await copyTextToClipboard(buildEvaluationPrompt(chat, chat.original_messages));
        showNotice("Old prompt copied to clipboard.");
      } catch (error) {
        showNotice(error.message, true);
      }
    });
    document.getElementById("edit-chat").addEventListener("click", openEditModal);
    document.getElementById("revert-chat").addEventListener("click", revertChatToOriginal);
    document.getElementById("remove-chat").addEventListener("click", () => confirmAction("remove"));
    document.getElementById("modal-revert-chat").addEventListener("click", revertChatToOriginal);
    document.getElementById("parse-paste-btn").addEventListener("click", () => {
      try {
        state.parsedMessages = extractJsonArrayFromPaste(
          document.getElementById("paste-chat-json").value
        );
        setEditError("");
        renderConversationMessages(document.getElementById("edit-preview"), state.parsedMessages, false);
        document.getElementById("save-edit").disabled = false;
      } catch (error) {
        state.parsedMessages = null;
        document.getElementById("save-edit").disabled = true;
        setEditError(error.message);
      }
    });
    document.getElementById("save-edit").addEventListener("click", saveEditedChat);
    document.getElementById("cancel-edit").addEventListener("click", () => {
      editModal.hidden = true;
    });
    document.getElementById("close-edit").addEventListener("click", () => {
      editModal.hidden = true;
    });
    editModal.addEventListener("click", event => {
      if (event.target === editModal) editModal.hidden = true;
    });
    document.getElementById("confirm-action").addEventListener("click", applyAction);
    document.getElementById("cancel-action").addEventListener("click", () => {
      modal.hidden = true;
      state.pendingAction = null;
    });
    document.getElementById("close-info").addEventListener("click", () => {
      infoModal.hidden = true;
    });
    infoModal.addEventListener("click", event => {
      if (event.target === infoModal) infoModal.hidden = true;
    });
    modal.addEventListener("click", event => {
      if (event.target === modal) {
        modal.hidden = true;
        state.pendingAction = null;
      }
    });
    if (REVIEWERS.length) loadReviewer();
  </script>
</body>
</html>
